[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bb-markassistant"
version = "0.1.0"
description = "Windows Blackboard homework review assistant"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8,<7", "requests>=2.32,<3", "beautifulsoup4>=4.12,<5",
  "httpx>=0.28,<1", "pyustc>=1.1,<2", "keyring>=25,<26", "defusedxml>=0.7,<1", "Pillow>=11,<13",
  "olefile>=0.47,<1", "pypdfium2>=4.30,<6"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6", "ruff>=0.9"]

[project.gui-scripts]
bb-markassistant = "bb_assistant.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
